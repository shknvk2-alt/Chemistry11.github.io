<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Основи — 30 завдань</title>
<style>
:root{--ink:#203047;--blue:#2457a7;--pale:#eef5ff;--green:#187548;--red:#b42318;--line:#d5deea}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px/1.5 Arial,sans-serif}
main{max-width:850px;margin:24px auto;padding:0 16px 40px}
header,.section,#result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 10px}h2{font-size:18px;color:var(--blue);margin:0 0 10px}
.progress{height:8px;background:#e0e7f0;border-radius:20px;overflow:hidden;margin:12px 0}
.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
.question{padding:12px 0;border-top:1px solid #e8edf4}.question:first-of-type{border-top:0}
.qtitle{font-weight:700;margin-bottom:6px}
label.option{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:6px;cursor:pointer}
label.option:hover{background:#f4f7fc}input{margin-top:5px;accent-color:var(--blue)}
.actions{display:flex;gap:10px;margin:16px 0}
button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#e8eef7;color:var(--ink)}
.feedback{font-size:14px;margin-top:4px;font-weight:bold;display:none}
.correct{background:#eaf7ef!important;border-left:4px solid var(--green);padding-left:8px!important}
.incorrect{background:#fff0ee!important;border-left:4px solid var(--red);padding-left:8px!important}
#result{display:none;border:2px solid var(--blue);padding:20px}.score{font-size:24px;font-weight:800}
.send-status{font-weight:bold;margin-top:10px;padding:10px;border-radius:6px;display:none;text-align:center}
.send-success{background:#eaf7ef;color:var(--green);border:1px solid #a6e3b8}
.send-loading{background:#fff8e6;color:#b78103;border:1px solid #ffd8a6}
</style>
</head>
<body>
<main>
<header>
  <h1>Основи. Натрій гідроксид і кальцій гідроксид (30 завдань)</h1>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <p id="progressText" style="font-size:14px;margin:0">Виконано завдань: 0 із 30</p>
</header>
<form id="quiz"></form>
<div class="actions"><button type="button" class="primary" id="check">Перевірити відповіді</button><button type="button" class="secondary" id="reset">Почати спочатку</button></div>
<div id="result" aria-live="polite">
    <div class="score" id="score"></div><div class="grade" id="grade"></div><div id="sendStatus" class="send-status"></div>
</div>
</main>
<script>
const quizData = [
  {q:"Що називають основами?",o:["Сполуки металу з Оксигену","Речовини з катіонами металу та гідроксид-іонами OH⁻","Речовини, що містять Гідроген"],c:"b"},
  {q:"Яка формула натрій гідроксиду?",o:["NaOH","Na₂O","Na(OH)₂"],c:"a"},
  {q:"Яка формула кальцій гідроксиду?",o:["CaOH","Ca(OH)₂","Ca₂OH"],c:"b"},
  {q:"Яка з наведених речовин є лугом?",o:["Cu(OH)₂","Fe(OH)₃","NaOH"],c:"c"},
  {q:"Яке твердження про Са(ОН)₂ правильне?",o:["Це малорозчинна основа","Це розчинна сіль","Це кислота"],c:"a"},
  {q:"Який колір набуває фенолфталеїн у лугах?",o:["Малиновий","Безбарвний","Синій"],c:"a"},
  {q:"Що відбувається з червоним лакмусом у лугах?",o:["Стає синім","Червоніє","Жовтіє"],c:"a"},
  {q:"Скільки гідроксид-іонів у Ca(OH)₂?",o:["Один","Два","Три"],c:"b"},
  {q:"Яка молекулярна маса NaOH?",o:["40","23","56"],c:"a"},
  {q:"Яка технічна назва NaOH?",o:["Каустична сода","Гашене вапно","Питна сода"],c:"a"},
  {q:"Що характерно для розчинення NaOH у воді?",o:["Виділення тепла","Повне замерзання","Утворення кисню"],c:"a"},
  {q:"Які продукти утворюються в реакції NaOH + HCl?",o:["NaCl і H₂O","Na₂O і H₂","Cl₂"],c:"a"},
  {q:"Яке рівняння нейтралізації Ca(OH)₂ записано правильно?",o:["Ca(OH)₂ + HCl -> CaCl₂ + H₂O","Ca(OH)₂ + 2HCl -> CaCl₂ + 2H₂O","CaOH + HCl -> CaCl + H₂"],c:"b"},
  {q:"Вапняна вода мутніє під дією якого газу?",o:["Вуглекислого (CO₂)","Kисню (O₂)","Водню (H₂)"],c:"a"},
  {q:"Що робити при потраплянні лугу на шкіру?",o:["Промити великою кількістю води","Витерти насухо","Залити кислотою"],c:"a"},
  {q:"З якими оксидами реагують луги?",o:["З кислотними","З основними","Не реагують"],c:"a"},
  {q:"Який осад випаде при взаємодії Ca(OH)₂ з Na₂CO₃?",o:["CaCO₃","NaOH","Осаду не буде"],c:"a"},
  {q:"Луги НЕ взаємодіють з:",o:["Барій оксидом (ВаО)","Кислотами","Кислотними оксидами"],c:"a"},
  {q:"Який колір має осад Cu(OH)₂?",o:["Блакитний","Червоний","Чорний"],c:"a"},
  {q:"Який колір має метилоранж у лугах?",o:["Жовтий","Рожевий","Безбарвний"],c:"a"},
  {q:"Як називають прозорий розчин Ca(OH)₂?",o:["Вапняна вода","Каустик","Рідке скло"],c:"a"},
  {q:"Яку сполуку називають негашеним вапном?",o:["CaO","Ca(OH)₂","CaCO₃"],c:"a"},
  {q:"Що таке «гасіння вапна»?",o:["Взаємодія CaO з водою","Заливання вапняку","Реакція з HCl"],c:"a"},
  {q:"Де переважно використовують гашене вапно?",o:["У будівництві","У ракетному паливі","Для плавлення металу"],c:"a"},
  {q:"NaOH використовують для виробництва:",o:["Мила та мийних засобів","Азотних добрив","Заліза"],c:"a"},
  {q:"Чому NaOH називають «їдким натром»?",o:["Він роз’їдає шкіру й тканини","Він дуже солоний","Він кислий"],c:"a"},
  {q:"Яким папірцем виявляють луги?",o:["Червоним лакмусовим","Синім лакмусовим","Звичайним білим"],c:"a"},
  {q:"Яка основа утвориться при взаємодії натрію з водою?",o:["NaOH","Ca(OH)₂","Na₂O"],c:"a"},
  {q:"Які мінерали складаються з CaCO₃?",o:["Крейда, мармур, вапняк","Граніт і пісок","Сіль"],c:"a"},
  {q:"Які засоби безпеки обов’язакові з твердим NaOH?",o:["Окуляри та рукавички","Вогнетривкий костюм","Нічого не потрібно"],c:"a"}
];

const quizForm = document.getElementById('quiz');
quizData.forEach((data, index) => {
    const qIdx = index + 1;
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.id = `question_${qIdx}`;
    qDiv.setAttribute('data-correct', data.c);
    
    let optionsHtml = '';
    const labels = ['a', 'b', 'c'];
    data.o.forEach((option, oIdx) => {
        optionsHtml += `<label class="option"><input type="radio" name="m${qIdx}" value="${labels[oIdx]}" onchange="updateProgress()"> ${option}</label>`;
    });

    qDiv.innerHTML = `<div class="qtitle">${qIdx}. ${data.q}</div>${optionsHtml}<div class="feedback"></div>`;
    quizForm.appendChild(qDiv);
});

function updateProgress(){
    let answered = 0;
    for(let i=1; i<=30; i++){if(document.querySelector(`input[name="m${i}"]:checked`)) answered++}
    document.getElementById('bar').style.width = (answered / 30 * 100) + '%';
    document.getElementById('progressText').innerText = `Виконано завдань: ${answered} із 30`;
}

document.getElementById('check').addEventListener('click', () => {
    let score = 0;
    for(let i=1; i<=30; i++) {
        const qDiv = document.getElementById(`question_${i}`);
        const feedback = qDiv.querySelector('.feedback');
        const checked = qDiv.querySelector('input:checked');
        const correctAns = qDiv.getAttribute('data-correct');
        
        const isCorrect = checked && checked.value === correctAns;
        if(isCorrect) {
            qDiv.className = 'question correct';
            feedback.innerText = '✅ Правильно!';
            score++;
        } else {
            qDiv.className = 'question incorrect';
            feedback.innerText = '❌ Неправильно.';
        }
        feedback.style.display = 'block';
    }
    const grade = Math.round((score / 30) * 12);
    document.getElementById('score').innerText = `Ваш результат: ${score} з 30 балів`;
    document.getElementById('grade').innerText = `Оцінка: ${grade} балів за 12-бальною шкалою`;
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    sendResultsToGoogle(grade, score);
});

function sendResultsToGoogle(grade, score) {
    const studentName = localStorage.getItem('chemistry_student_name') || "Анонімний учень";
    const scriptUrl = "https://google.com";
    const statusDiv = document.getElementById('sendStatus');
    statusDiv.style.display = 'block'; statusDiv.className = 'send-status send-loading';
    statusDiv.innerText = '⏳ Надсилання оцінки в журнал вчителя...';
    const urlWithParams = `${scriptUrl}?studentName=${encodeURIComponent(studentName)}&studentScore=${encodeURIComponent(grade + ' балів (Тест 30п: ' + score + '/30)')}`;
    fetch(urlWithParams, { method: 'POST', mode: 'no-cors' }).then(() => {
        statusDiv.className = 'send-status send-success'; statusDiv.innerText = '✅ Результат успішно збережено в журналі вчителя!';
    }).catch(() => { statusDiv.innerText = '❌ Помилка надсилання.'; });
}

document.getElementById('reset').addEventListener('click', () => {
    quizForm.reset(); document.getElementById('result').style.display = 'none';
    document.querySelectorAll('.question').forEach(q => q.className = 'question');
    document.querySelectorAll('.feedback').forEach(f => f.style.display = 'none'); updateProgress();
});
</script>
</body>
</html>
