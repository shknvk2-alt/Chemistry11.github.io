<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Основи — 12 запитань</title>
<style>
:root{--ink:#203047;--blue:#2457a7;--pale:#eef5ff;--green:#187548;--red:#b42318;--line:#d5deea}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px/1.5 Arial,sans-serif}
main{max-width:800px;margin:24px auto;padding:0 16px 40px}
header,section,#result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 10px}h2{font-size:19px;margin:0 0 10px}
.progress{height:8px;background:#e0e7f0;border-radius:20px;overflow:hidden;margin:12px 0}
.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
.question{padding:12px 0;border-top:1px solid #e8edf4}.question:first-of-type{border-top:0}
.qtitle{font-weight:700;margin-bottom:6px}
label.option{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:6px;cursor:pointer}
label.option:hover{background:#f4f7fc}input{margin-top:5px;accent-color:var(--blue)}
select{font:inherit;padding:6px;border:1px solid #b9c6d8;border-radius:6px;width:100%;max-width:450px;margin:4px 0}
.actions{display:flex;gap:10px;margin:16px 0}
button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#e8eef7;color:var(--ink)}
.feedback{font-size:14px;margin-top:4px;font-weight:bold;display:none}
.correct{background:#eaf7ef!important;border-left:4px solid var(--green);padding-left:8px!important}
.incorrect{background:#fff0ee!important;border-left:4px solid var(--red);padding-left:8px!important}
#result{display:none;border:2px solid var(--blue);padding:20px}.score{font-size:24px;font-weight:800}
.send-status{font-weight:bold;margin-top:10px;padding:10px;border-radius:6px;display:none;text-align:center}
.send-success{background:#eaf7ef;color:var(--green);border:1px solid #a6e3b8}
.send-loading{background:#fff8e6;color:#b78103;border:1px solid #ffd8a6}
</style>
</head>
<body>
<main>
<header>
  <h1>Основи. Натрій гідроксид і кальцій гідроксид (12 запитань)</h1>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <p id="progressText" style="font-size:14px;margin:0">Виконано завдань: 0 із 12</p>
</header>
<form id="quiz">
  <div class="section" id="part1"><h2>1. Оберіть одну правильну відповідь</h2></div>
  <div class="section" id="part2"><h2>2. Позначте всі правильні відповіді</h2></div>
  <div class="section" id="part3"><h2>3. Установіть відповідність</h2></div>
  <div class="section" id="part4"><h2>4. Властивості та поширення</h2></div>
</form>
<div class="actions"><button type="button" class="primary" id="check">Перевірити відповіді</button><button type="button" class="secondary" id="reset">Почати спочатку</button></div>
<div id="result" aria-live="polite">
    <div class="score" id="score"></div><div class="grade" id="grade"></div><div id="sendStatus" class="send-status"></div>
</div>
</main>
<script>
const quizData = [
  {p:1,t:"radio",c:"b",q:"Які речовини належать до основ?",o:["Сполуки лише з атомів металу й Оксигену","Складні речовини, що містять катіони металу та гідроксид-іони OH⁻","Складні речовини, що містять атоми Гідрогену й кислотний залишок"]},
  {p:1,t:"radio",c:"c",q:"Яка з наведених основ є лугом?",o:["Cu(OH)₂","Fe(OH)₃","NaOH"]},
  {p:1,t:"radio",c:"a",q:"Яка формула кальцій гідроксиду?",o:["Ca(OH)₂","CaOH","Ca₂OH"]},
  {p:1,t:"radio",c:"b",q:"Який індикатор у лужному середовищі стає малиновим?",o:["Метилоранж","Фенолфталеїн","Лакмус стає червоним"]},
  {p:2,t:"multi",c:"a,c,d",q:"Які твердження про натрій гідроксид правильні?",o:["Це тверда біла речовина за звичайних умов","Він безпечний для шкіри","Добре розчиняється у воді","Є їдкою речовиною, що викликає опіки"]},
  {p:2,t:"multi",c:"a,b,d",q:"Які твердження про кальцій гідроксид правильні?",o:["Його водну суспензію називають вапняним молоком","Прозорий насичений розчин називають вапняною водою","Він необмежено розчиняється у воді","Його використовують у будівництві"]},
  {p:2,t:"multi",c:"a,c",q:"Які дії відповідають правилам безпеки під час роботи з лугами?",o:["Працювати в захисних окулярах і рукавичках","Торкатися речовини пальцями","Уникати потрапляння на шкіру та в очі","Пробувати речовини на смак"]},
  {p:3,t:"selects",c:"b",q:"Оберіть характеристику для Натрій гідроксиду (NaOH):",o:["Малорозчинна основа","Добре розчинний у воді луг","Основний компонент крейди"]},
  {p:3,t:"selects",c:"a",q:"Оберіть характеристику для Кальцій гідроксиду (Ca(OH)₂):",o:["Малорозчинна у воді основа","Добре розчинний у воді луг","Речовина, з якої складаються крейда й вапняк"]},
  {p:4,t:"radio",c:"a",q:"Що спостерігають, якщо пропускати вуглекислий газ через вапняну воду?",o:["Розчин мутніє через утворення кальцій карбонату","Розчин стає синім через утворення міді","Виділяється натрій"]},
  {p:4,t:"radio",c:"c",q:"Де в природі поширені сполуки Кальцію, з яких отримують вапно?",o:["Переважно у складі повітря","Лише в морській воді","У вапняку, крейді та мармурі, основою яких є CaCO₃"]},
  {p:4,t:"radio",c:"b",q:"Який вислів про натрій гідроксид і кальцій гідроксид правильний?",o:["Обидві речовини можна безпечно куштувати в малих кількостях","Обидві речовини мають лужні властивості, але відрізняються розчинністю","Обидві речовини є кислотами"]}
];

quizData.forEach((data, idx) => {
    const qNum = idx + 1;
    const targetBlock = document.getElementById(`part${data.p}`);
    const qDiv = document.createElement('div');
    qDiv.className = 'question'; qDiv.id = `q_${qNum}`; qDiv.setAttribute('data-type', data.t); qDiv.setAttribute('data-cor', data.c);
    
    let opts = ''; const keys = ['a','b','c','d'];
    if(data.t === 'selects') {
        let selectOpts = '<option value="">Оберіть…</option>';
        data.o.forEach((o, oIdx) => { selectOpts += `<option value="${keys[oIdx]}">${o}</option>`; });
        opts = `<select id="sel_${qNum}" onchange="up()">${selectOpts}</select>`;
    } else {
        data.o.forEach((o, oIdx) => {
            const inputType = data.t === 'radio' ? 'radio' : 'checkbox';
            opts += `<label class="option"><input type="${inputType}" name="m${qNum}" value="${keys[oIdx]}" onchange="up()"> ${o}</label>`;
        });
    }
    qDiv.innerHTML = `<div class="qtitle">${qNum}. ${data.q}</div>${opts}<div class="feedback"></div>`;
    targetBlock.appendChild(qDiv);
});

function up(){
    let ans = 0;
    for(let i=1;i<=12;i++){
        const q = document.getElementById(`q_${i}`); if(!q)continue;
        const type = q.getAttribute('data-type');
        if(type === 'selects'){if(document.getElementById(`sel_${i}`).value) ans++}
        else{if(document.querySelector(`input[name="m${i}"]:checked`)) ans++}
    }
    document.getElementById('bar').style.width=(ans/12*100)+'%';
    document.getElementById('progressText').innerText=`Виконано завдань: ${ans} із 12`;
}

document.getElementById('check').addEventListener('click',()=> {
    let score = 0;
    for(let i=1;i<=12;i++){
        const q = document.getElementById(`q_${i}`); if(!q)continue;
        const type = q.getAttribute('data-type'), fb = q.querySelector('.feedback'), cor = q.getAttribute('data-cor');
        let isCor = false;
        if(type === 'radio'){
            const ch = q.querySelector('input:checked'); isCor = ch && ch.value === cor;
        }else if(type === 'multi'){
            const ch = Array.from(q.querySelectorAll('input:checked')).map(ins=>ins.value);
            const corArr = cor.split(','); isCor = ch.length === corArr.length && ch.every(v=>corArr.includes(v));
        }else if(type === 'selects'){
            isCor = document.getElementById(`sel_${i}`).value === cor;
        }
        if(isCor){q.className='question correct'; fb.innerText='✅ Правильно!'; score++}
        else{q.className='question incorrect'; fb.innerText='❌ Неправильно.'}
        fb.style.display='block';
    }
    const grade = Math.round((score/12)*12);
    document.getElementById('score').innerText=`Ваш результат: ${score} з 12 балів`;
    document.getElementById('grade').innerText=`Оцінка: ${grade} балів за 12-бальною шкалою`;
    document.getElementById('result').style.display='block';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
    send(grade,score);
});

function send(g,s){
    const name = localStorage.getItem('chemistry_student_name') || "Анонімний учень";
    const scriptUrl = "https://google.com";
    const d = document.getElementById('sendStatus'); d.style.display='block'; d.className='send-status send-loading'; d.innerText='⏳ Надсилання у журнал вчителя...';
    const url = `${scriptUrl}?studentName=${encodeURIComponent(name)}&studentScore=${encodeURIComponent(g+' балів (Тест 12п: '+s+'/12)')}`;
    fetch(url,{method:'POST',mode:'no-cors'}).then(()=>{d.className='send-status send-success';d.innerText='✅ Результат успішно збережено!';}).catch(()=>{d.innerText='❌ Помилка надсилання.';});
}

document.getElementById('reset').addEventListener('click',()=>{
    document.getElementById('quiz').reset(); document.getElementById('result').style.display='none';
    document.querySelectorAll('.question').forEach(q=>q.className='question'); document.querySelectorAll('.feedback').forEach(f=>f.style.display='none'); up();
});
</script>
</body>
</html>
