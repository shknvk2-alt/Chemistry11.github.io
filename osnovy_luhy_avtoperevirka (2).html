<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Основи — інтерактивна гра</title>
<style>
:root{--ink:#19253a;--blue:#2357c6;--line:#d9e1ee;--green:#167044;--red:#a62424}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 Arial,sans-serif;background:linear-gradient(135deg,#c5f4ff,#dbe8ff,#eee0ff);transition:background .35s}
main{width:min(850px,100%);margin:0 auto;padding:18px 14px 36px}
header,.panel,.result{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:0 12px 35px rgba(33,45,84,.12);padding:20px;margin-bottom:16px}
.topline{display:flex;justify-content:space-between;align-items:center}.pill{background:#eaf0ff;color:#2447a5;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800}
h1{font-size:24px;margin:10px 0 5px}h2{font-size:20px;margin:0 0 10px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-top:10px}.progress{height:10px;flex:1;background:#e5eaf4;border-radius:99px;overflow:hidden}.bar{width:0;height:100%;background:linear-gradient(90deg, #2b65ff, #8f5ce6);transition:width .25s ease}
.question-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.count{font-size:14px;font-weight:900;color:#fff;background:#253e8e;border-radius:8px;padding:5px 10px}
#prompt{font-size:20px;font-weight:800;margin:0 0 15px}.options{display:grid;gap:10px}
label.option{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid #e1e7f1;background:#fff;border-radius:12px;cursor:pointer}
label.option:hover{border-color:#90aaf1}input{accent-color:#315ed0;transform:scale(1.2)}
.feedback{padding:12px;border-radius:10px;margin-top:12px;font-weight:600;display:none}
.feedback.good{background:#e3f8e9;color:#135c36;border:1px solid #a6e3b8}
.feedback.bad{background:#fff0ed;color:#85241e;border:1px solid #ffb8ad}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.primary{background:#244fc0;color:white}.secondary{background:#e9edf5;color:#25354d}.check{background:#172f70;color:#fff}.danger{background:#c64545;color:white}button:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center}.score{font-size:26px;font-weight:900}
.send-status{font-weight:bold;margin-top:12px;padding:10px;border-radius:8px}
.send-success{background:#e3f8e9;color:#135c36}
.send-loading{background:#fff8e6;color:#b78103}
.send-error{background:#fdeaea;color:#9e2a2a}
</style>
</head>
<body>
  <main>
    <header>
      <div class="topline"><span class="pill">Інтерактивна гра</span></div>
      <h1>🥼 Основи. Луги. Натрій гідроксид і кальцій гідроксид</h1>
      <div class="progress-wrap">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <span id="progressText" style="font-weight:800;font-size:14px">0 із 5</span>
      </div>
    </header>

    <section id="startScreen" class="panel" style="text-align:center;padding:30px 15px">
      <h2>Готові до хімічного виклику? 🚀</h2>
      <p>Кожне запитання показується окремо. Правильна та неправильна відповідь підсвічуються підказками ✅ / ❌.</p>
      <button type="button" id="start" class="primary" style="font-size:18px;padding:12px 24px">Почати тест 🧪</button>
    </section>

    <section id="game" class="panel" style="display:none">
      <div class="question-meta">
        <span id="count" class="count">Питання 1</span>
        <button type="button" id="quitBtn" class="danger" style="padding:6px 12px;font-size:14px">❌ Завершити</button>
      </div>
      <p id="prompt"></p>
      <div id="answerArea" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="controls">
        <button type="button" id="prev" class="secondary">← Назад</button>
        <div>
          <button type="button" id="checkAnswer" class="check">Перевірити відповідь ✅</button>
          <button type="button" id="next" class="primary">Наступне →</button>
        </div>
      </div>
    </section>

    <section id="result" class="result">
      <h2>Тест завершено 🏁</h2>
      <div id="score" class="score"></div>
      <div id="grade" style="font-size:20px;font-weight:800;margin-top:5px;margin-bottom:20px"></div>
      <div id="sendStatus" class="send-status"></div>
      <button type="button" id="restartBtn" class="primary" style="padding:12px 24px;margin-top:10px">Почати заново 🔄</button>
    </section>
  </main>

  <script>
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyptrtJv8WILBClinEPgC1SlNmY41wVgjIPsznBOvh9OLtv85hj2Ze5nkncSxI-tLucg/exec';

    const questions = [
      {
        q: "Що називають основами?",
        options: ["Сполуки металу з киснем", "Речовини, що містять катіони металу та гідроксид-іони", "Солі у воді"],
        correct: 1,
        why: "Основи містять катіон металу та гідроксид-іони OH⁻."
      },
      {
        q: "Яка формула натрій гідроксиду?",
        options: ["NaOH", "Na₂O", "Na(OH)₂"],
        correct: 0,
        why: "Натрій одновалентний, тому формула — NaOH."
      },
      {
        q: "Яка формула кальцій гідроксиду?",
        options: ["CaOH", "Ca(OH)₂", "Ca₂OH"],
        correct: 1,
        why: "Кальцій двовалентний, тому потрібні дві OH-групи."
      },
      {
        q: "Яка з наведених речовин є лугом?",
        options: ["Cu(OH)₂", "Fe(OH)₃", "NaOH"],
        correct: 2,
        why: "NaOH — розчинна основа, тобто луг."
      },
      {
        q: "Яке твердження про Ca(OH)₂ правильне?",
        options: ["Це малорозчинна основа", "Це розчинна сіль", "Це луг, що частково розчиняється в воді"],
        correct: 2,
        why: "Кальцій гідроксид є малорозчинним лугом."
      }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let checkedStates = new Array(questions.length).fill(false);

    const startScreen = document.getElementById('startScreen');
    const gameSection = document.getElementById('game');
    const resultSection = document.getElementById('result');
    const promptEl = document.getElementById('prompt');
    const answerArea = document.getElementById('answerArea');
    const feedbackEl = document.getElementById('feedback');
    const countEl = document.getElementById('count');
    const bar = document.getElementById('bar');
    const progressText = document.getElementById('progressText');

    const startBtn = document.getElementById('start');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const checkBtn = document.getElementById('checkAnswer');
    const quitBtn = document.getElementById('quitBtn');
    const restartBtn = document.getElementById('restartBtn');

    startBtn.addEventListener('click', function() {
      startScreen.style.display = 'none';
      gameSection.style.display = 'block';
      showQuestion();
    });

    restartBtn.addEventListener('click', function() {
      currentIdx = 0;
      userAnswers.fill(null);
      checkedStates.fill(false);
      resultSection.style.display = 'none';
      gameSection.style.display = 'block';
      document.getElementById('sendStatus').className = 'send-status';
      document.getElementById('sendStatus').innerHTML = '';
      showQuestion();
    });

    quitBtn.addEventListener('click', finishGame);
    
    prevBtn.addEventListener('click', function() { 
      if(currentIdx > 0) { currentIdx--; showQuestion(); } 
    });
    
    nextBtn.addEventListener('click', function() {
      if(currentIdx < questions.length - 1) {
        currentIdx++;
        showQuestion();
      } else {
        finishGame();
      }
    });

    checkBtn.addEventListener('click', function() {
      const selected = document.querySelector('input[name="ans"]:checked');
      if(!selected) return;

      const val = parseInt(selected.value, 10);
      userAnswers[currentIdx] = val;
      checkedStates[currentIdx] = true;
      renderFeedback(val);
      updateButtons();
    });

    function showQuestion() {
      const q = questions[currentIdx];
      countEl.innerText = 'Питання ' + (currentIdx + 1) + ' із ' + questions.length;
      promptEl.innerText = q.q;
      answerArea.innerHTML = '';

      q.options.forEach(function(opt, idx) {
        const label = document.createElement('label');
        label.className = 'option';

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'ans';
        radio.value = idx;

        if (userAnswers[currentIdx] === idx) {
          radio.checked = true;
        }
        if (checkedStates[currentIdx]) {
          radio.disabled = true;
        }

        radio.addEventListener('change', function() {
          if(!checkedStates[currentIdx]) {
            userAnswers[currentIdx] = parseInt(radio.value, 10);
            checkBtn.disabled = false;
          }
        });

        const span = document.createElement('span');
        span.innerText = opt;

        label.appendChild(radio);
        label.appendChild(span);
        answerArea.appendChild(label);
      });

      if(checkedStates[currentIdx]) {
        renderFeedback(userAnswers[currentIdx]);
      } else {
        feedbackEl.style.display = 'none';
      }

      const progress = (currentIdx / questions.length) * 100;
      bar.style.width = progress + '%';
      progressText.innerText = currentIdx + ' із ' + questions.length;

      updateButtons();
    }

    function renderFeedback(val) {
      const q = questions[currentIdx];
      feedbackEl.style.display = 'block';
      if(val === q.correct) {
        feedbackEl.className = 'feedback good';
        feedbackEl.innerText = '✅ Правильно! ' + q.why;
      } else {
        feedbackEl.className = 'feedback bad';
        feedbackEl.innerText = '❌ Неправильно. Правильна відповідь: ' + q.options[q.correct] + '. ' + q.why;
      }
    }

    function updateButtons() {
      prevBtn.disabled = (currentIdx === 0);
      if (currentIdx === questions.length - 1) {
        nextBtn.innerText = 'Завершити 🏁';
      } else {
        nextBtn.innerText = 'Наступне →';
      }

      const hasSelection = userAnswers[currentIdx] !== null;
      if(checkedStates[currentIdx]) {
        checkBtn.style.display = 'none';
        nextBtn.disabled = false;
      } else {
        checkBtn.style.display = 'inline-block';
        checkBtn.disabled = !hasSelection;
      }
    }

    function finishGame() {
      gameSection.style.display = 'none';
      resultSection.style.display = 'block';
      bar.style.width = '100%';
      progressText.innerText = questions.length + ' із ' + questions.length;

      let correctCount = 0;
      questions.forEach(function(q, i) {
        if(userAnswers[i] === q.correct) correctCount++;
      });

      document.getElementById('score').innerText = correctCount + ' / ' + questions.length;

      let grade = 'Варто повторити теорію! 🫣';
      if(correctCount === questions.length) {
        grade = 'Відмінно! Ви справжній хімік 🧪🔥';
      } else if(correctCount >= Math.floor(questions.length * 0.7)) {
        grade = 'Добре! Гарні знання 📈';
      }
      document.getElementById('grade').innerText = grade;

      sendResultsToGoogle(correctCount);
    }

    function sendResultsToGoogle(score) {
      const statusEl = document.getElementById('sendStatus');
      statusEl.className = 'send-status send-loading';
      statusEl.innerText = 'Надсилання результатів у систему... ⏳';

      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ score: score, total: questions.length, timestamp: new Date().toISOString() })
      })
      .then(() => {
        statusEl.className = 'send-status send-success';
        statusEl.innerText = 'Результати успішно збережено! ✅';
      })
      .catch(err => {
        console.error(err);
        statusEl.className = 'send-status send-error';
        statusEl.innerText = 'Помилка надсилання даних. Перевірте з’єднання. ❌';
      });
    }
  </script>
</body>
</html>
